name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mock-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAG_MODE: mock
      RUN_REAL_INTEGRATION: "0"
      RUN_POSTGRES_INTEGRATION: "0"
      RUN_REAL_EVAL: "0"
      MOCK_ADMIN_PASSWORD: "mock-ci-${{ github.run_id }}-only!"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run ordinary tests
        working-directory: backend
        run: python -m unittest discover -s tests -v
      - name: Run free Eval
        working-directory: backend
        run: python -m evals.run_eval --mode mock --output-dir "${{ runner.temp }}/m9-eval"
      - name: Check tracked repository content
        run: python scripts/check_repository.py
